<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>51/51 · Talk it out</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <div class="topbar">
    <a href="/home" class="linkish" style="text-decoration:none">← Back home</a>
    <div id="couple" class="row"></div>
  </div>

  <section class="card chat">
    <header class="chat-head">
      <h1>Talk it out</h1>
      <p class="muted">A private chat between you and the 51/51 mediator. <span id="partner-line">Your partner</span> never sees it. If something should change, the mediator sends them a kind suggestion, never your words.</p>
    </header>

    <div class="thread" id="thread" aria-live="polite"></div>

    <form class="composer" id="ask">
      <textarea id="question" maxlength="1000" rows="2" placeholder="What's bothering you?" aria-label="Your message" required></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    <p class="error hidden" id="error"></p>
  </section>
</main>
<script src="/static/app.js"></script>
<script>
  if (!getKey()) location.href = "/";
  let me = null, partner = null;
  const thread = document.getElementById("thread");

  function when(iso) {
    return new Date(iso).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }
  function mine(text, iso) {
    return el("div", { class: "msg mine" },
      el("div", { class: "bubble ask c-" + me.colour + "-soft" }, text),
      el("div", { class: "stamp" }, iso ? when(iso) : "Sending"));
  }
  function theirs(text, nudged) {
    const parts = [el("div", { class: "bubble ai" }, text)];
    if (nudged && partner) parts.push(el("div", { class: "stamp" }, "A kind suggestion was sent to " + partner.name + "."));
    return el("div", { class: "msg ai" }, el("div", { class: "who-ai" }, "Mediator"), ...parts);
  }
  function scrollDown() { thread.scrollTop = thread.scrollHeight; }

  async function load() {
    let d;
    try { d = await api("/api/conflicts"); }
    catch (ex) { if (ex.status === 401) return forget(); return showError(ex.message); }
    me = d.me; partner = d.partner;
    const couple = document.getElementById("couple");
    couple.innerHTML = "";
    couple.append(whoChip(d.me));
    if (d.partner) couple.append(" & ", whoChip(d.partner));
    if (partner) document.getElementById("partner-line").textContent = partner.name;
    thread.innerHTML = "";
    if (!d.conflicts.length) {
      thread.append(el("div", { class: "msg ai" }, el("div", { class: "who-ai" }, "Mediator"),
        el("div", { class: "bubble ai" }, "Hi " + me.name + ". Tell me what's bothering you. I'll look at what you both logged and answer you calmly.")));
    }
    for (const c of d.conflicts) thread.append(mine(c.question, c.created_at), theirs(c.reply, c.nudged));
    scrollDown();
  }

  function showError(msg) {
    const err = document.getElementById("error");
    err.textContent = msg; err.classList.remove("hidden");
  }

  const box = document.getElementById("question");
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("ask").requestSubmit(); }
  });

  document.getElementById("ask").onsubmit = async (ev) => {
    ev.preventDefault();
    const text = box.value.trim();
    if (text.length < 3) return;
    document.getElementById("error").classList.add("hidden");
    const sent = mine(text, null);
    const typing = el("div", { class: "msg ai" }, el("div", { class: "who-ai" }, "Mediator"),
      el("div", { class: "bubble ai typing" }, el("span", { class: "thinking" }, "Reading your logs",
        el("i", {}, "."), el("i", {}, "."), el("i", {}, "."))));
    thread.append(sent, typing);
    box.value = ""; scrollDown();
    const btn = document.getElementById("send");
    btn.disabled = true;
    try {
      const r = await api("/api/conflicts", { method: "POST", json: { question: text } });
      sent.querySelector(".stamp").textContent = when(r.created_at);
      typing.replaceWith(theirs(r.reply, r.nudged));
    } catch (ex) {
      typing.remove(); sent.remove(); box.value = text;
      showError(ex.message);
    } finally {
      btn.disabled = false; box.focus(); scrollDown();
    }
  };
  load();
</script>
</body>
</html>
